name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '33.0.1'
      - name: Grant Gradle exec permission
        run: chmod +x ./gradlew
      - name: Configure Android SDK location
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: List APK output directory
        run: ls -R app/build/outputs/apk/debug
      - name: Publish Debug APK via GitHub CLI
        run: gh release create debug-${{ github.run_number }} app/build/outputs/apk/debug/app-debug.apk --repo ${{ github.repository }} --title 'Debug Build #${{ github.run_number }}' --notes 'Automated debug APK build'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}